name: Generate Sheep Manga Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate signing key
        run: |
          KEY_PASS=$(openssl rand -hex 16)
          keytool -genkeypair \
            -keystore signingkey.jks \
            -storepass "$KEY_PASS" \
            -keypass "$KEY_PASS" \
            -alias sheep-manga \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Sheep Manga, OU=Extensions, O=Sheep Manga, C=TW"

          echo "$KEY_PASS" > KEY_PASSWORD.txt

          keytool -list -v \
            -keystore signingkey.jks \
            -storepass "$KEY_PASS" \
            -alias sheep-manga \
            | grep "SHA256:" \
            | sed 's/.*SHA256: //' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]' \
            > SIGNING_KEY_FINGERPRINT.txt

          base64 -w 0 signingkey.jks > KEYSTORE_B64.txt

      - name: Package key backup
        run: |
          zip sheep-manga-signing-key.zip \
            signingkey.jks \
            KEY_PASSWORD.txt \
            SIGNING_KEY_FINGERPRINT.txt \
            KEYSTORE_B64.txt

      - name: Upload key backup
        uses: actions/upload-artifact@v4
        with:
          name: sheep-manga-signing-key
          path: sheep-manga-signing-key.zip
          retention-days: 1

name: Generate Sheep Manga Key

on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate key
        shell: bash
        run: |
          PASSWORD="$(openssl rand -hex 16)"

          keytool -genkeypair \
            -keystore signingkey.jks \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias sheep-manga \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Sheep Manga, O=Sheep Manga, C=TW"

          echo "$PASSWORD" > KEY_PASSWORD.txt

          keytool -list -v \
            -keystore signingkey.jks \
            -storepass "$PASSWORD" \
            -alias sheep-manga \
            > key-info.txt

          base64 -w 0 signingkey.jks > KEYSTORE_B64.txt

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: sheep-manga-signing-key
          path: |
            signingkey.jks
            KEY_PASSWORD.txt
            KEYSTORE_B64.txt
            key-info.txt
          retention-days: 1
